description = "Adds the Management door scanner page where an Officer points the laptop camera at a Confirmed Member's Pass; the scanner page also runs on the hotspot HTTPS origin in epic-release-acceptance entry 2 (no hard-coded localhost), while this entry verifies it on localhost. A browser QR decoder library chosen in this entry is served from wwwroot, with no runtime CDN (AD-14). The page reads the laptop camera and posts each decoded token to the entry 3 endpoint with the RequestVerificationToken header read from the layout meta tag (AD-8), then shows the JSON outcome and message (AD-9). Scan payloads are not logged (Consistency: Diagnostics) (delivering the camera scan interaction of R4)."
