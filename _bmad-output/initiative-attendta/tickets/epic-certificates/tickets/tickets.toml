[[entry]]
id = 1
type = "story"
title = "Playwright .NET setup and certificate PDF issuance tracer"
description = "Pins Microsoft.Playwright 1.64.1 in ASI.Basecode.WebApp, with Chromium installed on the dev host, and adds the Services-side certificate renderer interface with its WebApp Playwright adapter; implements a minimal issuance path that renders the A4 landscape PDF to bytes, saves them to the temporary area, promotes them to certificates/ through IPrivateFileStore and streams the promoted file back through an authorized action that calls a Services use case, delivering the initial tracer path for R5 and R6 on the existing certificates mapping from epic-platform-access (1.2); as the tracer it intentionally skips the certificates row write, lock and audit, which arrive in entry 7."
verify = "An Officer triggers the tracer action for a Confirmed Registration row inserted by a test SQL fixture; the action calls the issuance service, and the browser receives a landscape A4 PDF streamed as application/pdf from a relative certificates/ path whose bytes start with %PDF-."
covers = ["R5", "R6"]
after = ["1.1", "1.2", "2.2"]
hitl = true
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Fixed-template landscape A4 Razor certificate rendering with embedded fonts"
description = "Implements the fixed landscape A4 Razor certificate template in WebApp/Rendering with locally embedded Cinzel fonts, institutional branding, bindings for recipient name, Event title, Event start, issue date and the certificate number, dates formatted through the shared Asia/Manila formatter with its zone label (AD-11), and a visible development watermark until entry 3, delivering R5's fixed-template PDF part."
verify = "Rendering a certificate from the Razor template produces a landscape A4 PDF with embedded Cinzel fonts, the snapshot values, the certificate number and dates shown in Asia/Manila with a label, a visible development watermark, and no external network requests."
covers = ["R5"]
after = [1, "1.4"]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Configure official authorized signatory details"
description = "Configures the approved signatory name, title and signature image as non-secret application settings plus an embedded WebApp/Rendering asset used by the template, removes the development watermark, and delivers R5's official signatory requirement once Q1 is answered."
verify = "Rendering the fixed template with the configured signatory produces a landscape A4 PDF showing the signatory name, title and signature image, with no development watermark."
covers = ["R5"]
after = [2]
hitl = true
risk = "medium"
unknown = "Who is the authorized signatory (name, title, and signature image) for official certificate issuance?"

[[entry]]
id = 12
type = "story"
title = "Frontend certificate ledger decision dialogs and document viewer"
description = "Build DESIGN screens 16–17 from the existing fixed template/renderer and 1.13 contracts: completed-event selector, Eligibility Review/Issued Registry tabs, approve/decline/issue dialogs with reason/consequence feedback, and a quiet PDF view/download surface. Use explicitly labelled fixture reviews/outcomes until 6.4–6.8 are wired; a sample document is never presented as an officially issued retained certificate. Do not reimplement the renderer, invent signatories, enable bulk issuance or claim success before commit. Own certificate presentation/scoped assets, not the member-history partial. Use impeccable for implementation, critique and polish."
verify = "An Officer can inspect pending/eligible/declined/issued/failure states and the landscape A4 sample viewer, with coherent actions and reason dialogs on desktop and phone width. Prototype decisions do not write real records; the existing configured template is reused."
covers = ["R4", "R5", "R6", "R7", "R8"]
after = ["1.13", 2, 3]
hitl = false
risk = "medium"
phase = "frontend"
area = "frontend"
queue = 50
references = ["docs/DESIGN.md", "_bmad-output/initiative-attendta/delivery-queue.md"]
notes = ["Frontend only: use impeccable for implementation, rendered critique and polish. Build/CSS and focused tabs/dialog/viewer smoke; do not build a large suite over temporary fixture data.", "Real review/issue/download acceptance remains in #64–#68; the signatory configured by #63/PR102 is reused, not a new blocker."]

[[entry]]
id = 13
type = "story"
title = "Frontend member certificate history and download-link states"
description = "Fill 3.17's _CertificateLinkPartial/history contract with the member's pending/eligible/declined/issued/unavailable certificate presentation and an issued-only View/Download affordance. Use 1.13 isolated fixtures until 6.9 supplies the real owner query and 6.8 streams retained files; mark sample links visibly. Own only the certificate partial/scoped assets, not the My Events controller, pass or attendance partial. Use impeccable for implementation, critique and polish."
verify = "A Member switches to Certificates and distinguishes review versus issued states, with clear empty/unavailable feedback and no misleading official download for an unissued record. Keyboard, phone-width and independent history navigation work."
covers = ["R2", "R6"]
after = ["3.17"]
hitl = false
risk = "low"
phase = "frontend"
area = "frontend"
queue = 130
references = ["docs/DESIGN.md", "_bmad-output/initiative-attendta/delivery-queue.md"]
notes = ["Frontend only: impeccable implementation, rendered critique and polish; build/CSS and a short tab/link/keyboard smoke. Real file authorization and retention cases run at the finale."]

[[entry]]
id = 4
type = "story"
title = "Create certificate reviews in event completion transaction"
description = "Implements IEventCompletionHandler, which epic-events-registration's completion transaction (3.12) declares and calls inside its own transaction, inserting through CertificateRepository a pending_approval certificate review for each Registration with Valid Attendance (ParticipationFacts, AD-5) under the event lock completion already holds, with created_by set to the completing officer and no file or PDF work, delivering R1."
verify = "Completing an event creates pending_approval review rows for every Registration with Valid Attendance and none for absent or invalidated attendance, all in the completion's database transaction, and a completion that fails rolls back every review."
covers = ["R1"]
after = ["1.2", "1.3", "3.12"]
hitl = false
risk = "medium"
phase = "integration"
area = "backend"
queue = 290
notes = ["Use the mapped attendance table and canonical Valid Attendance fact; implementation can start once the completion hook exists without waiting for scanner UI or the recording engine. Final integration 8.11 still requires real attendance end to end."]

[[entry]]
id = 5
type = "story"
title = "Attendance invalidation review disqualification and issued-certificate lock"
description = "Implements IAttendanceInvalidationHandler, which epic-check-in's invalidation transaction (4.6) declares and calls inside its own transaction: throws Forbidden when the registration's certificate is issued, and otherwise sets its pending_approval or eligible review to not_eligible with the correction reason, delivering R3."
verify = "Invalidating an attendance record whose review is pending_approval or eligible sets that review to not_eligible with the reason recorded in the same commit; invalidating one whose certificate is issued is refused with a Forbidden outcome, and the attendance row stays valid."
covers = ["R3"]
after = [4, "4.6"]
hitl = false
risk = "high"
phase = "integration"
area = "backend"
queue = 340

[[entry]]
id = 6
type = "story"
title = "Management certificate review queue and approval decisions"
description = "Implements the 25-row paged review queue on the shared PageRequest and _Pager (AD-13), and the approve and decline decisions: each discovers its candidate, locks the owner's users row and then the event, rechecks pending_approval status and Valid Attendance through ParticipationFacts, and refuses as Stale a candidate that changed; decline displays the SPEC §14.2 warning that the decision cannot be reopened in this release and requires a non-blank reason validated inside the transaction; each decision appends a certificate.approved or certificate.declined entry, delivering R8, R4 and R7."
verify = "An Officer approves a pending review to mark it eligible and declines another with a required reason to make it not_eligible; both append Activity Log entries, a decline without a reason is refused and the queue shows 25 rows per page. A focused fixture-backed guard check proves a changed/non-pending review is refused as Stale without mutation; the actual invalidation-versus-decision flow is verified after 6.5 at the finale."
covers = ["R4", "R7", "R8"]
after = [4, 12, "1.3", "1.6", "1.9"]
hitl = false
risk = "medium"
phase = "integration"
area = "backend"
queue = 350
notes = ["Wire the 6.12 ledger contract with real read/decision sources, not a second screen. Review commands recheck Valid Attendance; 6.5 protects invalidation and must be present before issuance in 6.7."]

[[entry]]
id = 7
type = "story"
title = "Transactional certificate issuance pipeline and audit"
description = "Wire 6.12's 25-row paged issuance queue/control to the real query and use case: pre-check issued state outside locks; render using the existing fixed template with a unique number; write/promote through IPrivateFileStore; then in one caller-owned transaction lock owner user, event and certificate, recheck approval, Valid Attendance and Completed status, and save certificate_number, retained snapshots, issuer_name_snapshot, relative file_path, issuer/time and certificate.issued audit. Rendering/file I/O stays outside locks. Failed commit deletes the new file; retry never replaces an issued PDF. Implement the invalidation guard from 6.5 before enabling issuance. Critical real-SQL race authoring is centralized in 8.5, execution in 8.4; use a PDF test double for lock tests and the installed Chromium for renderer checks."
verify = "Focused development check: one eligible issuance persists the retained PDF and snapshots/audit, and a duplicate attempt leaves its bytes unchanged. Finale cases CERT-01/02 in finale-test-cases.md must prove exactly one issuance under concurrent requests and a safe invalidation-versus-issuance outcome before release."
covers = ["R3", "R5", "R7", "R8"]
after = [2, 3, 5, 6, "1.3", "1.6", "1.9", "2.2"]
hitl = false
risk = "high"
phase = "integration"
area = "backend"
queue = 360

[[entry]]
id = 8
type = "story"
title = "Authorized certificate streaming download endpoint"
description = "Delivers R6 through a GET action that takes a certificate id and never a path, admits the owner (matching ActorUserId) or any caller with the Management policy, lets inactive memberships through, relies on the AD-8 session check that refuses inactive Accounts, and streams the file_path read through IPrivateFileStore.OpenReadAsync after a containment check as application/pdf."
verify = "The owner and a Management user each download an issued certificate as application/pdf; an unauthenticated request and an inactive Account are sent to sign-in, a non-owner Member and an unknown id receive the identical not-found response, and no request can name a path."
covers = ["R6"]
after = [7, 12]
hitl = false
risk = "medium"
phase = "integration"
area = "backend"
queue = 370

