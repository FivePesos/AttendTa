<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1120" height="820" fill="#f8fafc"/>

  <text x="60" y="46" font-size="22" font-weight="600" fill="#0f172a">Certificate rendering after 6.11 — one path removed, one made unconditional</text>
  <text x="60" y="70" font-size="13" fill="#64748b">Only what the linked code does. The retained-PDF pipeline is untouched; the sample path is gone.</text>

  <!-- ============ LEFT: removed ============ -->
  <rect x="60" y="100" width="470" height="560" rx="12" fill="#fff7f7" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="84" y="132" font-size="15" font-weight="600" fill="#7f1d1d">Removed — the development tracer</text>

  <rect x="84" y="150" width="422" height="72" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="102" y="176" font-size="13.5" font-weight="600" fill="#7f1d1d">/CertificateTracer · /CertificateTracer/Trace</text>
  <text x="102" y="197" font-size="11.5" fill="#991b1b">CertificateTracerController + Views/CertificateTracer/Index.cshtml</text>

  <rect x="84" y="250" width="422" height="64" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="102" y="276" font-size="13.5" font-weight="600" fill="#7f1d1d">CertificateTracerService</text>
  <text x="102" y="297" font-size="11.5" fill="#991b1b">ICertificateTracerService + the Startup.DI registration</text>

  <rect x="84" y="342" width="422" height="72" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="102" y="368" font-size="13.5" font-weight="600" fill="#7f1d1d">RenderSampleAsync()</text>
  <text x="102" y="389" font-size="11.5" fill="#991b1b">fixed snapshot · isDevelopmentSample: true</text>

  <rect x="84" y="442" width="422" height="72" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="102" y="468" font-size="13.5" font-weight="600" fill="#7f1d1d">sample branch in the template</text>
  <text x="102" y="489" font-size="11.5" fill="#991b1b">watermark · red banner · if/else around the signatory</text>

  <text x="84" y="552" font-size="12" fill="#991b1b">Deleted end to end. No environment has this route:</text>
  <text x="84" y="572" font-size="12" fill="#991b1b">anonymous is challenged to /Account/Login,</text>
  <text x="84" y="592" font-size="12" fill="#991b1b">an authenticated member or officer gets 404.</text>

  <g stroke="#b91c1c" stroke-width="1.6" fill="none" marker-end="url(#arrowRed)">
    <line x1="295" y1="222" x2="295" y2="248"/>
    <line x1="295" y1="314" x2="295" y2="340"/>
    <line x1="295" y1="414" x2="295" y2="440"/>
  </g>

  <!-- ============ RIGHT: kept ============ -->
  <rect x="590" y="100" width="470" height="560" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="614" y="132" font-size="15" font-weight="600" fill="#0f172a">Kept — the official pipeline</text>

  <rect x="614" y="150" width="422" height="64" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="632" y="176" font-size="13.5" font-weight="600" fill="#0f172a">CertificateLedgerService</text>
  <text x="632" y="197" font-size="11.5" fill="#475569">issuance and decision — the only caller of the renderer</text>

  <rect x="614" y="242" width="422" height="64" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="632" y="268" font-size="13.5" font-weight="600" fill="#0f172a">ICertificatePdfRenderer.RenderSnapshotAsync</text>
  <text x="632" y="289" font-size="11.5" fill="#475569">no isDevelopmentSample parameter any more</text>

  <rect x="614" y="334" width="422" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="632" y="360" font-size="13.5" font-weight="600" fill="#0f172a">RenderPdfAsync</text>
  <text x="632" y="381" font-size="11.5" fill="#475569">signatory options are read on every render</text>
  <text x="632" y="400" font-size="11.5" fill="#475569">the signature image must load or the render throws</text>

  <rect x="614" y="442" width="422" height="72" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="632" y="468" font-size="13.5" font-weight="600" fill="#065f46">CertificateTemplate.cshtml</text>
  <text x="632" y="489" font-size="11.5" fill="#047857">signatory section is unconditional markup</text>

  <rect x="614" y="542" width="422" height="78" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="632" y="568" font-size="13.5" font-weight="600" fill="#0f172a">RenderAndPromoteAsync</text>
  <text x="632" y="589" font-size="11.5" fill="#475569">temporary → promote → certificates/</text>
  <text x="632" y="608" font-size="11.5" fill="#475569">unchanged by this pull request</text>

  <g stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="825" y1="214" x2="825" y2="240"/>
    <line x1="825" y1="306" x2="825" y2="332"/>
    <line x1="825" y1="414" x2="825" y2="440"/>
    <line x1="825" y1="514" x2="825" y2="540"/>
  </g>

  <!-- ============ BOTTOM: reads ============ -->
  <rect x="60" y="690" width="620" height="100" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="84" y="718" font-size="14" font-weight="600" fill="#0f172a">Reads — one new repository method</text>
  <text x="84" y="742" font-size="12" fill="#475569">GET document + member history → GetByRegistrationIdNoTrackingAsync</text>
  <text x="84" y="762" font-size="12" fill="#475569">decision + issuance → GetByRegistrationIdAsync (tracked)</text>

  <!-- ============ BOTTOM: tests ============ -->
  <rect x="700" y="690" width="360" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="724" y="718" font-size="14" font-weight="600" fill="#1e3a8a">CertificatePdfRendererTests</text>
  <text x="724" y="742" font-size="12" fill="#1e40af">6 official-template facts, kept verbatim</text>
  <text x="724" y="762" font-size="12" fill="#1e40af">1 retired-route fact, new</text>
</svg>
