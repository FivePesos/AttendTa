<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1240" height="800" fill="#f9fafb"/>

  <text x="40" y="46" font-size="21" font-weight="600" fill="#111827">PR #215 — what the change does</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Two independent moves: the demo seam is deleted, and the shared rules get one home.</text>

  <!-- Panel 1 -->
  <rect x="40" y="92" width="560" height="300" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="60" y="122" font-size="15" font-weight="600" fill="#111827">1 · Demo seam — deleted</text>

  <g font-size="12.5" font-family="Consolas, monospace">
    <rect x="60" y="138" width="230" height="26" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="72" y="155" fill="#b91c1c" text-decoration="line-through">DemoDataOptions.cs</text>
    <rect x="60" y="170" width="230" height="26" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="72" y="187" fill="#b91c1c" text-decoration="line-through">DemoDataStartupGuard.cs</text>
    <rect x="60" y="202" width="230" height="26" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="72" y="219" fill="#b91c1c" text-decoration="line-through">DemoStore.cs</text>
    <rect x="60" y="234" width="230" height="26" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="72" y="251" fill="#b91c1c" text-decoration="line-through">DemoSeedService.cs</text>
    <rect x="60" y="266" width="230" height="26" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="72" y="283" fill="#b91c1c" text-decoration="line-through">DemoDataRegistration.cs</text>
  </g>

  <text x="330" y="146" font-size="12" font-weight="600" fill="#6b7280">wiring cut</text>
  <g font-size="12" font-family="Consolas, monospace" fill="#374151">
    <text x="330" y="170">Program.cs · --demo-pass-token</text>
    <text x="330" y="194">Startup.cs · guard call</text>
    <text x="330" y="218">Startup.DI.cs · AddDemoData</text>
    <text x="330" y="242">appsettings.json · DemoData</text>
  </g>
  <text x="330" y="276" font-size="12" fill="#047857">kept: --demo-readiness</text>
  <text x="330" y="296" font-size="12" fill="#047857">kept: hotspot block</text>
  <text x="60" y="330" font-size="12" fill="#6b7280">Nothing replaces the seam. The app has no demo mode left.</text>
  <text x="60" y="352" font-size="12" fill="#6b7280">An unknown DemoData key is inert configuration.</text>

  <!-- Panel 2 -->
  <rect x="640" y="92" width="560" height="300" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="660" y="122" font-size="15" font-weight="600" fill="#111827">2 · One rule, one file</text>

  <rect x="660" y="134" width="520" height="28" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="920" y="153" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">ParticipationFacts</text>

  <g font-size="12">
    <text x="664" y="184" fill="#6b7280" font-weight="600">rule</text>
    <text x="820" y="184" fill="#6b7280" font-weight="600">SQL expression</text>
    <text x="1000" y="184" fill="#6b7280" font-weight="600">in-memory twin</text>
    <line x1="660" y1="192" x2="1180" y2="192" stroke="#e5e7eb"/>
  </g>
  <g font-size="12" font-family="Consolas, monospace">
    <text x="664" y="212" fill="#374151">eligible participant</text>
    <text x="820" y="212" fill="#1d4ed8">EligibleParticipant</text>
    <text x="1000" y="212" fill="#9ca3af">—</text>
    <text x="664" y="234" fill="#374151">valid attendance</text>
    <text x="820" y="234" fill="#1d4ed8">ValidAttendance</text>
    <text x="1000" y="234" fill="#047857">IsValidAttendance</text>
    <text x="664" y="256" fill="#374151">seat held</text>
    <text x="820" y="256" fill="#1d4ed8">SeatHeld</text>
    <text x="1000" y="256" fill="#047857">HoldsSeat</text>
    <text x="664" y="278" fill="#374151">open registration</text>
    <text x="820" y="278" fill="#1d4ed8">OpenRegistration</text>
    <text x="1000" y="278" fill="#047857">IsOpenRegistration</text>
    <text x="664" y="300" fill="#374151">certificate eligible</text>
    <text x="820" y="300" fill="#9ca3af">composed</text>
    <text x="1000" y="300" fill="#047857">IsCertificateEligible</text>
  </g>
  <text x="660" y="332" font-size="12" fill="#6b7280">Callers: RegistrationRepository · CheckInLookupService · AttendanceRecording</text>
  <text x="660" y="350" font-size="12" fill="#6b7280">AttendanceInvalidation · PassService · MemberEventService · MyEventsService</text>
  <text x="660" y="368" font-size="12" fill="#6b7280">MyCertificatesService · the report · the certificate ledger</text>

  <!-- Panel 3 -->
  <rect x="40" y="412" width="560" height="300" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="60" y="442" font-size="15" font-weight="600" fill="#111827">3 · Report — five reads become one snapshot</text>

  <g font-size="11.5" font-family="Consolas, monospace">
    <rect x="60" y="456" width="196" height="24" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="70" y="472" fill="#9ca3af" text-decoration="line-through">GetSummaryFactsAsync</text>
    <rect x="60" y="486" width="196" height="24" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="70" y="502" fill="#9ca3af" text-decoration="line-through">GetNoShowCountAsync</text>
    <rect x="60" y="516" width="196" height="24" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="70" y="532" fill="#9ca3af" text-decoration="line-through">GetAttendeeDistribution</text>
    <rect x="60" y="546" width="196" height="24" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="70" y="562" fill="#9ca3af" text-decoration="line-through">CountDetailRowsAsync</text>
    <rect x="60" y="576" width="196" height="24" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="70" y="592" fill="#9ca3af" text-decoration="line-through">GetDetailPageAsync</text>
  </g>

  <line x1="256" y1="528" x2="300" y2="528" stroke="#6b7280" marker-end="url(#arrow)"/>
  <rect x="304" y="504" width="180" height="48" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="394" y="524" font-size="12" font-family="Consolas, monospace" fill="#1d4ed8" text-anchor="middle">GetSnapshotAsync</text>
  <text x="394" y="541" font-size="11" fill="#6b7280" text-anchor="middle">one query, all statuses</text>

  <line x1="394" y1="552" x2="394" y2="576" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <line x1="120" y1="576" x2="540" y2="576" stroke="#2563eb"/>
  <g font-size="11.5" fill="#374151">
    <line x1="120" y1="576" x2="120" y2="592" stroke="#2563eb"/>
    <rect x="72" y="592" width="96" height="34" rx="5" fill="#ffffff" stroke="#d1d5db"/>
    <text x="120" y="613" text-anchor="middle">Summary</text>
    <line x1="260" y1="576" x2="260" y2="592" stroke="#2563eb"/>
    <rect x="212" y="592" width="96" height="34" rx="5" fill="#ffffff" stroke="#d1d5db"/>
    <text x="260" y="613" text-anchor="middle">No-shows</text>
    <line x1="400" y1="576" x2="400" y2="592" stroke="#2563eb"/>
    <rect x="352" y="592" width="96" height="34" rx="5" fill="#ffffff" stroke="#d1d5db"/>
    <text x="400" y="613" text-anchor="middle">Breakdowns</text>
    <line x1="520" y1="576" x2="520" y2="592" stroke="#2563eb"/>
    <rect x="472" y="592" width="96" height="34" rx="5" fill="#ffffff" stroke="#d1d5db"/>
    <text x="520" y="613" text-anchor="middle">Page slice</text>
  </g>
  <text x="60" y="654" font-size="12" fill="#6b7280">Every panel is derived from the same list, so they cannot disagree</text>
  <text x="60" y="672" font-size="12" fill="#6b7280">while attendance changes.</text>
  <text x="60" y="694" font-size="12" fill="#b45309">Cost: the whole event is materialized per request. Bounded by the</text>
  <text x="60" y="710" font-size="12" fill="#b45309">event's registrations, not by the page size.</text>

  <!-- Panel 4 -->
  <rect x="640" y="412" width="560" height="300" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="660" y="442" font-size="15" font-weight="600" fill="#111827">4 · Certificate — one predicate</text>

  <rect x="660" y="470" width="130" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="725" y="494" font-size="12.5" fill="#374151" text-anchor="middle">Decide</text>
  <rect x="660" y="530" width="130" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="725" y="554" font-size="12.5" fill="#374151" text-anchor="middle">Issue</text>

  <line x1="790" y1="489" x2="828" y2="489" stroke="#6b7280" marker-end="url(#arrow)"/>
  <line x1="790" y1="549" x2="828" y2="520" stroke="#6b7280" marker-end="url(#arrow)"/>

  <rect x="832" y="462" width="196" height="66" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="930" y="484" font-size="12" font-family="Consolas, monospace" fill="#1d4ed8" text-anchor="middle">IsCertificateEligible</text>
  <text x="930" y="502" font-size="11" fill="#374151" text-anchor="middle">seat · attendance ·</text>
  <text x="930" y="517" font-size="11" fill="#374151" text-anchor="middle">review state · completed</text>

  <line x1="1028" y1="495" x2="1064" y2="495" stroke="#6b7280" marker-end="url(#arrow)"/>
  <rect x="1068" y="474" width="112" height="42" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="1124" y="492" font-size="11.5" fill="#047857" text-anchor="middle">proceed</text>
  <text x="1124" y="507" font-size="11.5" fill="#047857" text-anchor="middle">or Stale</text>

  <text x="660" y="592" font-size="12" fill="#6b7280">The completion query selects the same seats:</text>
  <text x="660" y="610" font-size="12" font-family="Consolas, monospace" fill="#1d4ed8">CertificateRepository.GetRegistrationsAwaitingReview</text>
  <text x="660" y="628" font-size="12" fill="#6b7280">Confirmed + valid attendance + no review yet.</text>

  <text x="660" y="656" font-size="12" fill="#b45309">A review only exists after completion, so the decision path's</text>
  <text x="660" y="672" font-size="12" fill="#b45309">Completed requirement changes no reachable outcome.</text>
  <text x="660" y="694" font-size="12" fill="#6b7280">A missing event row is refused before the rule runs.</text>

  <!-- Legend -->
  <g font-size="12" fill="#6b7280">
    <rect x="40" y="740" width="14" height="14" rx="3" fill="#fef2f2" stroke="#fecaca"/>
    <text x="62" y="752">deleted</text>
    <rect x="130" y="740" width="14" height="14" rx="3" fill="#eff6ff" stroke="#2563eb"/>
    <text x="152" y="752">the one implementation</text>
    <rect x="300" y="740" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="322" y="752">replaced</text>
    <rect x="400" y="740" width="14" height="14" rx="3" fill="#ffffff" stroke="#d1d5db"/>
    <text x="422" y="752">consumer / panel</text>
  </g>
  <text x="40" y="776" font-size="11.5" fill="#9ca3af">Source: pr-215 at 149791b plus the walkthrough's 11 review patches. Only what the linked code does is drawn.</text>
</svg>
